<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - BUK Student Exit Clearance System</title>
    <link rel="icon" type="image/png" href="images/buk-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="auth-hero">
        <img src="images/buk-logo.png" alt="Bayero University, Kano logo" class="auth-logo">
        <h1>BUK Student Exit Clearance System</h1>
        <p class="auth-tagline">To lead in research and education in Africa</p>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Forgot your password?</h2>
            <p class="auth-sub">Enter your registered email and we will send you a link to reset your password.</p>

            <div id="message" class="message"></div>

            <form id="forgot-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="e.g. amina@gmail.com" required>
                </div>
                <button type="submit" class="btn btn--block" id="send-btn">Send reset link</button>
            </form>

            <div class="auth-foot">Remembered it? <a href="index.html">Back to log in</a></div>
        </div>
    </main>

    <footer class="auth-footer">&copy; Bayero University, Kano &middot; Final Year Project</footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/forgot-password.js"></script>
</body>

</html>
