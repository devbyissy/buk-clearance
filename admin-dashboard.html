<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BUK Student Exit Clearance System</title>
    <link rel="icon" type="image/png" href="images/buk-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="app-shell">

        <aside class="sidebar">
            <div class="sidebar__brand">
                <img src="images/buk-logo.png" alt="Bayero University, Kano logo">
                <div class="sidebar__brand-name">BUK Exit Clearance<small>Administrator</small></div>
            </div>
            <div class="sidebar__user"><strong id="side-name">Loading...</strong><span>Administrator</span></div>
            <nav>
                <a class="active" href="admin-dashboard.html">
                    <svg class="icon" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9" />
                        <rect x="14" y="3" width="7" height="5" />
                        <rect x="14" y="12" width="7" height="9" />
                        <rect x="3" y="16" width="7" height="5" />
                    </svg>
                    Dashboard
                </a>
                <a href="admin-staff.html">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="9" cy="8" r="3.5" />
                        <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
                        <circle cx="17.5" cy="9" r="2.5" />
                        <path d="M17 14.2c2.6.2 4.5 2 4.5 4.8" />
                    </svg>
                    Staff Accounts
                </a>
                <a href="admin-areas.html">
                    <svg class="icon" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                        <line x1="9" y1="10" x2="9" y2="20" />
                    </svg>
                    Clearance Areas
                </a>
            </nav>
            <div class="sidebar__logout">
                <button class="btn btn--outline btn--sm" id="logout-btn" style="width:100%;">Logout</button>
            </div>
        </aside>

        <main class="content">
            <div id="page-error" class="message"></div>

            <section class="welcome-band">
                <div class="welcome-band__text">
                    <p class="welcome-band__eyebrow">System overview</p>
                    <h1 id="welcome-title">Welcome</h1>
                    <p class="welcome-band__sub" id="welcome-sub">Loading the clearance figures...</p>
                </div>
                <div class="ring" aria-label="Students fully cleared">
                    <svg viewBox="0 0 100 100" width="112" height="112">
                        <circle cx="50" cy="50" r="44" class="ring__track" />
                        <circle cx="50" cy="50" r="44" class="ring__bar" id="ring-bar" />
                    </svg>
                    <div class="ring__text"><span class="ring__num" id="ring-num">0/0</span><span
                            class="ring__label">Fully cleared</span></div>
                </div>
            </section>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-card__label">Total Students</div>
                    <div class="stat-card__num" id="stat-total">-</div>
                </div>
                <div class="stat-card stat-card--green">
                    <div class="stat-card__label">Fully Cleared</div>
                    <div class="stat-card__num" id="stat-full">-</div>
                </div>
                <div class="stat-card stat-card--orange">
                    <div class="stat-card__label">Pending Clearance</div>
                    <div class="stat-card__num" id="stat-pending">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__label">Staff Accounts</div>
                    <div class="stat-card__num" id="stat-staff">-</div>
                </div>
            </div>

            <h2 class="section-title">Clearance status by office</h2>
            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th>Office</th>
                            <th>Pending</th>
                            <th>Cleared</th>
                        </tr>
                    </thead>
                    <tbody id="areas-body"></tbody>
                </table>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>

</html>
