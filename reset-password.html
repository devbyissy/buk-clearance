<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - BUK Student Exit Clearance System</title>
    <link rel="icon" type="image/png" href="images/buk-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="auth-hero">
        <img src="images/buk-logo.png" alt="Bayero University, Kano logo" class="auth-logo">
        <h1>BUK Student Exit Clearance System</h1>
        <p class="auth-tagline">To lead in research and education in Africa</p>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Set a new password</h2>
            <p class="auth-sub" id="checking">Checking your reset link...</p>

            <div id="message" class="message"></div>

            <form id="reset-form" style="display:none;">
                <div class="field">
                    <label for="new-password">New password</label>
                    <div class="pw-wrap">
                        <input type="password" id="new-password" placeholder="At least 8 characters" required>
                        <button type="button" class="pw-toggle" id="pw-toggle">SHOW</button>
                    </div>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm new password</label>
                    <div class="pw-wrap">
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                        <button type="button" class="pw-toggle" id="pw-toggle-2">SHOW</button>
                    </div>
                </div>
                <button type="submit" class="btn btn--block" id="save-btn">Save new password</button>
            </form>

            <div id="done" style="display:none;">
                <a class="btn btn--block" href="index.html">Go to log in</a>
            </div>

            <div id="request-new" style="display:none;">
                <a class="btn btn--block" href="forgot-password.html">Request a new reset link</a>
            </div>

            <div class="auth-foot"><a href="index.html">Back to log in</a></div>
        </div>
    </main>

    <footer class="auth-footer">&copy; Bayero University, Kano &middot; Final Year Project</footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/reset-password.js"></script>
</body>

</html>
