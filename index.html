<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - BUK Student Exit Clearance System</title>
    <link rel="icon" type="image/png" href="images/buk-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="auth-hero">
        <img src="images/buk-logo.png" alt="Bayero University, Kano logo" class="auth-logo">
        <h1>BUK Student Exit Clearance System</h1>
        <p class="auth-tagline">To lead in research and education in Africa</p>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Sign in</h2>
            <p class="auth-sub">Enter your email and password to continue</p>

            <div id="message" class="message"></div>

            <form id="login-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="e.g. amina@gmail.com" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="pw-toggle" id="pw-toggle">SHOW</button>
                    </div>
                </div>
                <div class="forgot-row"><a href="forgot-password.html">Forgot password?</a></div>
                <button type="submit" class="btn btn--block" id="login-btn">Log in</button>
            </form>

            <div class="auth-foot">New student? <a href="register.html">Register as Student</a></div>
        </div>
    </main>

    <footer class="auth-footer">&copy; Bayero University, Kano &middot; Final Year Project</footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
